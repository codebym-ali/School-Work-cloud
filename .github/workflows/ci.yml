name: CI

# Pipeline order mirrors blueprint §34:
#   lint -> typecheck -> unit -> integration -> RLS-coverage + isolation -> build
# The RLS-coverage gate and the tenant-isolation suite are MERGE-BLOCKING (§21.6):
# a new tenant table shipped without a policy, or any cross-tenant leak, fails here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d school"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      API_PORT: '3000'
      APP_APEX_DOMAIN: localhost:3000
      RESERVED_SUBDOMAINS: www,api,admin,app
      DATABASE_URL: postgresql://app_user:app_pw@localhost:5432/school?schema=public
      PLATFORM_DATABASE_URL: postgresql://platform_admin:platform_pw@localhost:5432/school?schema=public
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACTIVE_KID: k1
      JWT_KEYS: '{"k1":"ci-secret-k1-please-change","k2":"ci-secret-k2-please-change"}'
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      COOKIE_SECURE: 'false'
      COOKIE_DOMAIN: localhost
      # Deterministic 32-byte base64 key for CI only.
      ENCRYPTION_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: school-uploads
      # MinIO (below) is the S3 backend in CI; its root creds must be ≥8 chars, and the
      # storage/PDF integration tests upload+fetch through it. StorageService auto-creates
      # the bucket (HeadBucket→CreateBucket), so no bucket bootstrap step is needed.
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMS_PROVIDER: console
      SMS_WEBHOOK_HMAC_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      # MinIO is the S3 backend for the storage/PDF integration tests (report-card,
      # certificate, upload pipeline). It can't be a `services:` entry because that block
      # can't set the required `server /data` command, so start it here and wait for health.
      # MinIO is the S3 backend for the storage/PDF integration tests (report-card, certificate,
      # upload pipeline). It cannot be a `services:` entry because that block cannot set the
      # required `server /data` command, so it is started here.
      #
      # ⚠️ Pulled from Docker Hub, pinned to a release tag. This used to pull `quay.io/minio/minio`
      # to dodge Docker Hub's shared-IP rate limit — but MinIO gated their quay.io repo, so that pull
      # now fails on EVERY run with `unauthorized: access to the requested resource is not authorized`
      # (not the transient `toomanyrequests` quay.io was chosen to avoid). Docker Hub's `minio/minio`
      # is still the public source — it is what local `docker compose` runs — so we pull it from there.
      #
      # Pinned to an explicit RELEASE tag, not `:latest`: a moving tag makes the S3 backend drift
      # under CI and turns an upstream change into a mystery red run. Bump this deliberately.
      #
      # The retry/backoff loop stays, now covering Docker Hub's rate limit (the reason for the original
      # quay.io move); the readiness probe prints the container log on failure so the reason is in the
      # step that failed.
      - name: Start MinIO (S3-compatible object storage)
        run: |
          set -euo pipefail
          MINIO_IMAGE=minio/minio:RELEASE.2025-09-07T16-13-09Z
          for attempt in 1 2 3; do
            if docker pull -q "$MINIO_IMAGE"; then break; fi
            echo "pull attempt $attempt failed; retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
            [ "$attempt" = 3 ] && { echo "could not pull the MinIO image" >&2; exit 1; }
          done
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             "$MINIO_IMAGE" server /data
          echo "waiting for MinIO to be ready…"
          for i in $(seq 1 60); do
            if curl -fs http://localhost:9000/minio/health/ready > /dev/null; then
              echo "MinIO ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio || true
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ⚠️ The URL is stripped of its query string before psql sees it. `?schema=public` is a
      # PRISMA parameter; libpq rejects the whole URI with `invalid URI query parameter: "schema"`
      # and exits 2.
      #
      # This step has failed since the first commit, which means every gate after it — lint,
      # typecheck, unit, integration, the merge-blocking isolation suite, the build — has NEVER run
      # in CI. The job was decorative. `${VAR%%\?*}` removes from the first `?` onward.
      - name: Bootstrap DB roles + extensions
        run: psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f scripts/postgres-init.sql

      - name: Prisma generate
        run: pnpm prisma:generate

      # Runs BEFORE migrate: a migration that drops a SQL-companion object (prisma migrate diff
      # cannot see prisma/sql/*.sql, so it emits DROPs for them) must fail review, not be applied.
      - name: Migration safety gate (no companion-owned DROPs)
        run: pnpm db:check-migrations

      # ⚠️ Three separate steps, not one `run:` block with three commands. When they were combined,
      # a red X said only "Migrate + SQL companions + RLS coverage gate" and the reason had to be
      # read out of the log. Named steps make the job list itself the diagnosis — which matters most
      # to whoever is looking at a failure they cannot reproduce.
      - name: Migrate (prisma migrate deploy)
        run: pnpm prisma:deploy

      - name: SQL companions (extensions, partial uniques, checks, trigram, RLS, grants)
        run: pnpm db:sql

      - name: RLS coverage gate (merge-blocking, §21.6)
        run: pnpm db:check-rls

      - name: Lint
        run: pnpm lint

      # ⚠️ The shared packages (@sw/roles, @sw/school-ui — 74 files every front-end depends on) were
      # linted by NOTHING: the root glob covers {apps,libs,test}, and each app's `next lint` walks
      # only its own directory. They have their own TS project because they are React/JSX needing the
      # DOM lib, which the backend project deliberately lacks.
      - name: Lint shared packages
        run: pnpm lint:packages

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      # Playwright specs are excluded from the root project (they need the DOM lib the API
      # deliberately lacks), so they get their own step. Without it they would be unchecked.
      - name: Typecheck Playwright specs
        run: npx tsc -p test/e2e/tsconfig.json --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Tenant-isolation suite (merge-blocking, §21.6)
        run: pnpm test:isolation

      - name: Build (api + worker bundles)
        run: pnpm build

  # Frontend gate. The five front-ends are WORKSPACE MEMBERS (Front-End Instance Separation Plan,
  # Phase 3a), not standalone packages: `apps/*` is the only workspace glob, they share one hoisted
  # install so packages/* resolve a single React copy, and their per-app lockfiles were deleted.
  #
  # ⚠️ This job previously did `pnpm install --frozen-lockfile` INSIDE apps/web against
  # `apps/web/pnpm-lock.yaml`. That file stopped existing at a84d19d, so the job — and therefore all
  # of CI — has been red on every run since, while the four front-ends added by the split were never
  # checked at all. Install at the ROOT; run each app's gates through the workspace filter.
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, superadmin-web, owner-web, staff-web, student-web]
    steps:
      - uses: actions/checkout@v4

      # ⚠️ No `version:` input on purpose. package.json declares `packageManager: pnpm@9.14.4`, and
      # pnpm/action-setup@v4 treats specifying BOTH as an error ("Multiple versions of pnpm
      # specified") — which fails the job at setup, before a single gate runs, so the log says
      # nothing about the code. Letting the action read packageManager keeps ONE source of truth
      # for the pnpm version, so a bump cannot leave the workflow disagreeing with the repo.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ./apps/${{ matrix.app }} typecheck

      - name: Lint
        run: pnpm --filter ./apps/${{ matrix.app }} lint

      - name: Build
        run: pnpm --filter ./apps/${{ matrix.app }} build
        env:
          NEXT_API_ORIGIN: http://demo.localhost:3000
