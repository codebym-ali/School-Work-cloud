# Production-style stack (blueprint §33). Backend image → api + worker; a separate web
# image (apps/web) serves the Next.js frontend; a one-shot `migrate` runs `prisma migrate
# deploy` + the SQL companions + the RLS-coverage gate before the apps start. A Traefik
# edge routes one origin: /api → api, / → web, preserving Host so tenant subdomains resolve.
# Self-contained (bundled postgres/redis/minio) so it runs on a single VPS or locally; on
# Coolify you'd point DATABASE_URL/REDIS_URL/S3_* at managed services instead.
#
#   cp .env.example .env   # set ENCRYPTION_MASTER_KEY, JWT_KEYS, real S3/SMS secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   # browse a tenant: http://<tenant>.localhost  (e.g. demo.localhost → *.localhost = 127.0.0.1)
#
# Secrets come from .env (env_file); only the in-network service URLs are overridden here.

x-app-env: &app-env
  # connection_limit sized for the fee-season payment burst: payments serialize on the
  # per-school receipt counter, so blocked-in-transaction connections must not starve the
  # pool (§25.5). pool_timeout aligns with the tx maxWait in TenantPrismaService.
  DATABASE_URL: postgres://app_user:app_pw@postgres:5432/school?connection_limit=25&pool_timeout=15
  PLATFORM_DATABASE_URL: postgres://platform_admin:platform_pw@postgres:5432/school
  MIGRATION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/school
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  NODE_ENV: production
  # .env's API_PORT=4000 is the local-dev convention; the image's EXPOSE, the healthcheck
  # below, and the Traefik loadbalancer label all assume the container listens on 3000.
  API_PORT: '3000'
  TZ: Asia/Karachi
  # §29 brute-force protection, pinned ON here rather than left to `.env`.
  #
  # ⚠️ `env_file: .env` below hands these services the SAME file local dev uses, and local dev
  # sets `RATE_LIMIT_ENABLED=false` on purpose (the e2e suite makes ~13 logins in a run). Without
  # this line a dev env file silently disabled password-guessing protection on every school's
  # login page — measured 2026-08-12, this stack was running with it off. `environment:` wins over
  # `env_file:`, so the server is protected no matter what the file says, and `validateEnv` now
  # refuses to boot a production API without it.
  RATE_LIMIT_ENABLED: 'true'

services:
  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && node scripts/apply-sql-companions.mjs && node scripts/check-rls-coverage.mjs"
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: .
    command: node dist/apps/api/main
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Ingress via Traefik: /api/* → this service, Host preserved so the API's
    # TenantResolutionMiddleware still resolves the school from the subdomain.
    # Served on the TLS entrypoint (websecure); http is redirected to https at the edge.
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=3000

  worker:
    build: .
    command: node dist/apps/worker/main
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: ./apps/web
    # Same-origin API calls (/api/v1/*) are split off by Traefik before they reach Next,
    # so NEXT_API_ORIGIN (the dev proxy fallback) is unused in this topology.
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Catch-all router (lower priority than the API's /api prefix). TLS entrypoint; http redirects.
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3001

  # Edge router (blueprint §33). Path-routes on one origin: /api → api, / → web, and
  # forwards the original Host so multi-tenant subdomain resolution works end-to-end.
  #
  # TLS (audit 2.2) — closes the "cleartext / Secure-cookie can't be sent" gap:
  #   • websecure :443 entrypoint + a Let's Encrypt certresolver ('le')
  #   • all http (:80) is 301-redirected to https, so nothing is ever served in cleartext
  # This makes COOKIE_SECURE=true actually work (a Secure cookie cannot travel over http).
  #
  # ⚠️ CHALLENGE TYPE — the TLS-ALPN challenge below issues a cert per hostname as each host is
  # first requested, which fits the apex + reserved subdomains. The multi-tenant role hosts are
  # TWO labels deep (owner.<school>.schoolworks.com), which a single wildcard cannot cover, so for
  # the tenant fleet use a **DNS-01 wildcard** instead (needs your DNS provider's API token):
  #   - --certificatesresolvers.le.acme.dnschallenge=true
  #   - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
  #   and pass CF_DNS_API_TOKEN in the environment. On Coolify, its built-in Traefik does this for
  # you (set the wildcard there); this block is the self-hosted/standalone path. See deploy/Caddyfile
  # for the on-demand-TLS alternative that mints per-host certs without a wildcard.
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect every plaintext request to https (permanent) — no cleartext path remains.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt (ACME). Email + persisted account/cert store; TLS-ALPN challenge by default.
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@schoolworks.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # acme.json holds issued certs + the ACME account key — persist it or you re-issue (and hit
      # Let's Encrypt rate limits) on every restart.
      - letsencrypt:/letsencrypt
    depends_on:
      - api
      - web
    restart: unless-stopped

  postgres:
    # Custom image = postgres:16-alpine + rclone + archive-wal.sh (docker/postgres/Dockerfile).
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    # WAL archiving → point-in-time recovery (blueprint §29 RPO ≤5m via archive_timeout=300;
    # §33 DR). archive-wal.sh keeps a fast on-box copy in /wal-archive AND, when
    # WAL_R2_ENABLED=true, durably ships each segment to R2 (rclone) so PITR survives host
    # loss — it returns non-zero until the R2 upload lands, so Postgres never recycles
    # un-shipped WAL. Off by default → local runs archive on-box only. See [[DR Runbook]].
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school
      WAL_LOCAL_DIR: /wal-archive
      # Set WAL_R2_ENABLED=true + the R2/rclone vars in .env to ship WAL off-box (see .env.example).
      WAL_R2_ENABLED: ${WAL_R2_ENABLED:-false}
      R2_BUCKET: ${R2_BUCKET:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d school']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  walarchive:
  redisdata:
  miniodata:
  letsencrypt:
